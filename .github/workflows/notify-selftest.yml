name: career-ops notify self-test

# On-demand workflow to prove the email + Telegram + CSV notification path
# works end-to-end from GitHub's runner (which holds the secrets). Runs a
# manual dispatch only — never on a schedule. Use to verify alerts after any
# change. Reports a demo offer so the send steps actually fire.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create demo offers + build rich alert
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          cat > /tmp/new-offers.txt <<EOF
          + 2K | Localization Language Lead, Arabic | Remote | https://job-boards.greenhouse.io/2k/jobs/7809858003 | 80000-110000 USD | posted: $TODAY
          + xAI (SpaceXAI) | AI Tutor - Arabic | Remote | https://job-boards.greenhouse.io/xai/jobs/5090171007 | posted: $TODAY
          + Outschool | Online English Tutor | Remote | https://outschool.com/tutor | 40-60 USD/hour | posted: $TODAY
          EOF
          node generate-alert.mjs /tmp/new-offers.txt
          # Sample candidates file so Full List sheet has content
          cat > /tmp/candidates.json <<EOF
          {
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%MZ)",
            "count": 3,
            "candidates": [
              {"company":"2K","role":"Localization Language Lead, Arabic","location":"Remote","url":"https://job-boards.greenhouse.io/2k/jobs/7809858003","salary":{"min":80000,"max":110000,"currency":"USD"},"postedAt":"$TODAY","source":"greenhouse"},
              {"company":"KAYAK","role":"Freelance Localization Specialist","location":"Remote","url":"https://job-boards.greenhouse.io/kayak/jobs/5709804002","salary":{"min":50,"max":70,"currency":"USD"},"postedAt":"$TODAY","source":"greenhouse"},
              {"company":"Peroptyx","role":"Data Analyst","location":"Belgium","url":"https://www.workingnomads.com/job/go/1821504/","salary":null,"postedAt":"$TODAY","source":"workingnomads"}
            ]
          }
          EOF
          # Sample raw 'all found' file so the wide All Jobs 700+ sheet has rows
          cat > /tmp/all-found.json <<EOF
          {
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%MZ)",
            "count": 5,
            "offers": [
              {"company":"2K","role":"Localization Language Lead, Arabic","location":"Remote","url":"https://job-boards.greenhouse.io/2k/jobs/7809858003","salary":{"min":80000,"max":110000,"currency":"USD"},"postedAt":"$TODAY","source":"greenhouse"},
              {"company":"xAI","role":"AI Tutor - Arabic","location":"Remote","url":"https://job-boards.greenhouse.io/xai/jobs/5090171007","salary":null,"postedAt":"$TODAY","source":"greenhouse"},
              {"company":"Outschool","role":"Online English Tutor","location":"Remote","url":"https://outschool.com/tutor","salary":{"min":40,"max":60,"currency":"USD"},"postedAt":"$TODAY","source":"outschool"},
              {"company":"KAYAK","role":"Freelance Localization Specialist","location":"Remote","url":"https://job-boards.greenhouse.io/kayak/jobs/5709804002","salary":{"min":50,"max":70,"currency":"USD"},"postedAt":"$TODAY","source":"greenhouse"},
              {"company":"Appen","role":"Data Annotation - Arabic","location":"Remote","url":"https://www.appen.com/careers","salary":null,"postedAt":"$TODAY","source":"appen"}
            ]
          }
          EOF

      - name: Build Excel workbook (Matches + Full List)
        run: |
          python -m pip install --quiet openpyxl 2>/dev/null || true
          python build-xlsx.py
        env:
          MATCHES_CSV: /tmp/alert-rows.csv
          CANDIDATES_JSON: /tmp/candidates.json
          ALL_FOUND_JSON: /tmp/all-found.json
          SCAN_RUNS_TSV: data/scan-runs.tsv
          OUT_XLSX: /tmp/matches.xlsx

      - name: Send alerts (email + Telegram + Excel)
        run: python send_alert.py 3
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ALERT_EMAIL: /tmp/alert-email.md
          ALERT_TG: /tmp/alert-telegram.txt
          ALERT_XLSX: /tmp/matches.xlsx
