name: career-ops scan

# Runs the headless ATS portal scanner 6x/day (Tripoli time, UTC+2)
# and emails Waleed when new matching offers are found.
on:
  schedule:
    - cron: '0 5,8,11,14,17,20 * * *'   # 07:00, 10:00, 13:00, 16:00, 19:00, 22:00 Tripoli (UTC+2)
  workflow_dispatch: {}                  # allow manual trigger

permissions:
  contents: write

concurrency:
  group: career-ops-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run portal scanner
        id: scan
        run: |
          node scan.mjs 2>&1 | tee /tmp/scan.log
          # extract the "+" offer lines that follow "New offers:" (stop at the
          # blank line / footer that closes the section)
          awk 'BEGIN{s=0} /^New offers:$/{s=1;next} /^$/{if(s)exit} s&&/^  \+ /' /tmp/scan.log > /tmp/new-offers.txt || true

      - name: Count new offers
        id: count
        run: |
          if [ -s /tmp/new-offers.txt ]; then
            NEW=$(grep -c '^  + ' /tmp/new-offers.txt || true)
            echo "new=${NEW:-0}" >> "$GITHUB_OUTPUT"
          else
            echo "new=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build alert (TG + email params)
        if: steps.count.outputs.new != '0'
        run: node generate-alert.mjs /tmp/new-offers.txt || true

      - name: Export pipeline CSV
        run: node export-pipeline-csv.mjs || true

      - name: Build Excel workbook (Matches + Full List)
        run: |
          python -m pip install --quiet openpyxl 2>/dev/null || true
          # Label this run's stacked table with Tripoli (UTC+2) time.
          export RUN_LABEL=$(TZ=Etc/GMT-2 date +%H:%M)
          echo "RUN_LABEL=$RUN_LABEL"
          python build-xlsx.py
        env:
          MATCHES_CSV: /tmp/alert-rows.csv
          CANDIDATES_JSON: data/candidates.json
          ALL_FOUND_JSON: data/all-found.json
          SCAN_RUNS_TSV: data/scan-runs.tsv
          OUT_XLSX: data/matches.xlsx

      - name: Commit scanner results
        run: |
          git config user.name "career-ops bot"
          git config user.email "waleedba19@users.noreply.github.com"
          # Force-add generated data so scan history/dedup persists across runs.
          git add -f data/ output/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(scan): update pipeline $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Send alerts (email + Telegram + Excel)
        if: steps.count.outputs.new != '0' && (env.SMTP_PASS != '' || env.TG_BOT_TOKEN != '')
        run: python send_alert.py "${{ steps.count.outputs.new }}"
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ALERT_EMAIL: /tmp/alert-email.md
          ALERT_TG: /tmp/alert-telegram.txt
          ALERT_XLSX: data/matches.xlsx