name: career-ops scan

# Runs the headless ATS portal scanner 6x/day (Tripoli time, UTC+2)
# and emails Waleed when new matching offers are found.
on:
  schedule:
    - cron: '0 5,8,11,14,17,20 * * *'   # 07:00, 10:00, 13:00, 16:00, 19:00, 22:00 Tripoli (UTC+2)
  workflow_dispatch: {}                  # allow manual trigger

permissions:
  contents: write

concurrency:
  group: career-ops-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run portal scanner
        id: scan
        run: |
          node scan.mjs 2>&1 | tee /tmp/scan.log
          # extract the "+" offer lines that follow "New offers:" (stop at the
          # blank line / footer that closes the section)
          awk 'BEGIN{s=0} /^New offers:$/{s=1;next} /^$/{if(s)exit} s&&/^  \+ /' /tmp/scan.log > /tmp/new-offers.txt || true

      - name: Count new offers
        id: count
        run: |
          if [ -s /tmp/new-offers.txt ]; then
            NEW=$(grep -c '^  + ' /tmp/new-offers.txt || true)
            echo "new=${NEW:-0}" >> "$GITHUB_OUTPUT"
          else
            echo "new=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Export pipeline CSV
        run: node export-pipeline-csv.mjs || true

      - name: Commit scanner results
        run: |
          git config user.name "career-ops bot"
          git config user.email "waleedba19@users.noreply.github.com"
          # Force-add generated data so scan history/dedup persists across runs.
          git add -f data/ output/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(scan): update pipeline $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Email new matches
        if: steps.count.outputs.new != '0' && env.SMTP_PASS != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "CareerOps: ${{ steps.count.outputs.new }} new remote job match(es)"
          to: ${{ secrets.SMTP_TO }}
          from: "CareerOps Scanner <${{ secrets.SMTP_USER }}>"
          convert_markdown: true
          attachments: data/pipeline.csv
          body: |
            **New remote job matches found for Waleed Ballag.**

            $(sed -E 's#(https?://[^ |]+)#<\1>#g' /tmp/new-offers.txt 2>/dev/null || echo "See data/pipeline.md")

            ---
            **Where each job came from:** the apply links above open the official
            posting on the employer's own board (Greenhouse, Workable, etc.) — that
            is always the safe, direct channel.

            **Full lists for this run (attached):**
            - 📊 **Spreadsheet (CSV):** attached to this email — open in Excel or
              [view it here](https://github.com/waleedba19/career-ops/blob/main/data/pipeline.csv)
            - 📋 **Full pipeline:** [data/pipeline.md](https://github.com/waleedba19/career-ops/blob/main/data/pipeline.md)
              — every match ever found, still open.

            ---
            **Next step:** open the CSV/Excel, pick one you like, and tell me the
            company name — I will read the posting, pre-fill the application form
            from your CV, and draft the message. You review and click submit.
            Nothing is ever submitted without you.

            — CareerOps automatic scanner
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Telegram new matches
        if: steps.count.outputs.new != '0' && env.TG_BOT_TOKEN != ''
        run: |
          python - "${{ steps.count.outputs.new }}" <<'PY'
          import json, os, sys, urllib.request
          n = sys.argv[1]
          with open("/tmp/new-offers.txt", encoding="utf-8") as f:
              lines = [l.strip(" +") for l in f if l.strip()]
          jobs = []
          for l in lines:
              parts = [p.strip() for p in l.split("|")]
              if len(parts) >= 4:
                  company, title, loc, url = parts[0], parts[1], parts[2], parts[3]
                  jobs.append(f"{company} — {title} ({loc})\n{url}")
              else:
                  jobs.append(l)
          text_lines = [f"CareerOps: {n} new remote job match(es)"] + jobs
          if len(jobs) > 12:
              text_lines = text_lines[:13] + [f"… +{len(jobs)-12} more in the attached CSV / link below"]
          text = "\n\n".join(text_lines)
          text += ("\n\n📊 Full list & links: github.com/waleedba19/career-ops/blob/main/data/pipeline.md"
                   "\n🧾 CSV view: github.com/waleedba19/career-ops/blob/main/data/pipeline.csv"
                   "\n\nReview on your PC (Excel tracker) and tell me which company to apply to — I pre-fill everything, you click submit. Nothing is auto-submitted.")
          if len(text) > 4000:
              text = text[:3970] + "\n…"
          data = json.dumps({
              "chat_id": os.environ["TG_CHAT_ID"],
              "text": text,
              "disable_web_page_preview": False,
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_BOT_TOKEN']}/sendMessage",
              data=data, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as r:
              print(r.status)
          PY
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}