# Portal Scanner Configuration — Waleed Ballag
# Targets: Arabic-English translation, ESL teaching, academic services,
# and vetted remote data entry / typing / admin roles.
# Strategy: WebSearch with site: filters (broad discovery), plus portal scans.

# -- Location filter --
# Waleed works remotely and, as of the Libya/Middle-East expansion, also accepts
# on-site roles IN LIBYA or IN ANY MIDDLE-EAST / ARAB-WORLD COUNTRY. PASS:
#   - a remote/anywhere/worldwide marker, OR
#   - Libya / its main cities (he lives there), OR
#   - a Middle-East / Arab-world country (on-site is fine there).
# Otherwise reject on-site roles in hub countries where he cannot work (US, EU,
# Asia-Pacific, etc.). Empty location strings pass (don't penalize missing data),
# but a description-based guard in scan.mjs re-checks empty-location postings
# against the blocked-hub country list below.
location_filter:
  always_allow:
    - "Remote"
    - "remote"
    - "Worldwide"
    - "Anywhere"
    - "Global"
    - "Anywhere in the world"
    - "Libya"
    - "Tripoli"
    - "Benghazi"
  block:
    # On-site hub countries Waleed cannot work in (non-ME, non-Libya).
    - "United States"
    - "United Kingdom"
    - "Canada"
    - "Australia"
    - "France"
    - "Germany"
    - "Spain"
    - "Italy"
    - "Netherlands"
    - "Poland"
    - "Sweden"
    - "Norway"
    - "Denmark"
    - "Finland"
    - "Ireland"
    - "Portugal"
    - "Singapore"
    - "Indonesia"
    - "Philippines"
    - "Malaysia"
    - "Vietnam"
    - "Thailand"
    - "Pakistan"
    - "India"
    - "Bangladesh"
    - "Sri Lanka"
    - "Nigeria"
    - "Kenya"
    - "Ghana"
    - "South Africa"
    - "Japan"
    - "South Korea"
    - "China"
    - "Brazil"
    - "Mexico"
    - "Argentina"
    - "Colombia"
    - "Chile"
    # Hub cities — on-site roles are useless to Waleed; the country keyword
    # often isn't in the location string ("Adelaide," carries no "Australia").
    # always_allow "Remote" still rescues genuine remote listings.
    - "Adelaide"
    - "Sydney"
    - "Melbourne"
    - "Brisbane"
    - "Perth"
    - "Auckland"
    - "London"
    - "Manchester"
    - "Birmingham"
    - "Leeds"
    - "Glasgow"
    - "Edinburgh"
    - "Dublin"
    - "Paris"
    - "Berlin"
    - "Munich"
    - "Frankfurt"
    - "Amsterdam"
    - "Brussels"
    - "Madrid"
    - "Barcelona"
    - "Milan"
    - "Rome"
    - "Lisbon"
    - "New York"
    - "Los Angeles"
    - "San Francisco"
    - "Chicago"
    - "Austin"
    - "Toronto"
    - "Vancouver"
    - "Jakarta"
    - "Bangkok"
    - "Ho Chi Minh"
    - "Manila"
    - "Mumbai"
    - "Delhi"
    - "Bangalore"
    - "Karachi"
    - "Lahore"
    - "Lagos"
    - "Nairobi"
    - "Johannesburg"
    - "Cape Town"
  allow: []

# -- Scan history recheck --
scan_history:
  recheck_after_days: 30

# -- Title filter: what we hunt for --
# Positive: translation, ESL, academic, data-entry related titles
# Negative: irrelevant heavy-tech roles
title_filter:
  positive:
    # Translation
    - "Arabic Translator"
    - "Arabic-English Translator"
    - "English-Arabic Translator"
    - "legal translator"
    - "translator"
    - "Arabic localization"
    - "transcreation"
    - "Arabic linguist"
    - "Arabic language specialist"
    # ESL / English teaching
    - "ESL teacher"
    - "ESL instructor"
    - "English teacher"
    - "English tutor"
    - "online English"
    - "EFL"
    - "TESOL"
    - "TEFL"
    - "English instructor"
    - "English language teacher"
    # Academic services
    - "thesis editor"
    - "academic editor"
    - "academic writer"
    - "proofreader"
    - "academic proofreading"
    - "manuscript editor"
    - "research assistant"
    - "data analyst"
    - "SPSS"
    # Data entry / admin / typing
    - "data entry"
    - "typist"
    - "transcription"
    - "virtual assistant"
    - "administrative assistant"
    - "data annotation"
    - "document processing"
    - "data entry operator"
  negative:
    - "word:Engineer"
    - "word:Developer"
    - "word:Software"
    - "word:DevOps"
    - "word:Backend"
    - "word:Frontend"
    - "word:Full Stack"
    - "word:QA"
    - "word:SRE"
    - "word:Security Engineer"
    - "word:Data Scientist"
    - "word:ML Engineer"
    - "word:Crypto"
    - "word:Blockchain"
    - "word:Cryptocurrency"

